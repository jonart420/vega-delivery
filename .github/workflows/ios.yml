name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen
      # Simulator build without code signing – checks that the app compiles.
      - run: >
          xcodebuild build
          -project VegaDelivery.xcodeproj
          -scheme VegaDelivery
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          | tail -n 200
          ; exit ${PIPESTATUS[0]}
